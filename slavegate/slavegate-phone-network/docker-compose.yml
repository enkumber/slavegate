services:
  app_proxy:
    environment:
      APP_HOST: phone-network-server
      APP_PORT: 21211

  phone-network-server:
    image: ghcr.io/enkumber/slavegate-server:f1ba97b3b8837ad88ac99c1ac5ba07cdc62e3e08
    env_file:
      - ${APP_DATA_DIR}/.env
    restart: unless-stopped
    ports:
      - ${APP_PHONE_NETWORK_DIRECT_PORT:-21212}:21211
    environment:
      NODE_ENV: production
      PORT: 21211
      BASE_URL: http://enkzoned.go.ro:3000
      REDIS_URL: redis://phone-network-redis:6379
      TRANSPORT_MODE: direct
      DATA_DIR: /data
      MODEL_CONFIG_ENDPOINT_ALLOWLIST: "local:enkzoned.go.ro"
      PHONE_NETWORK_APP_VERSION: "3.9.273"
      UI_GRAPH_RUNTIME_MODE: "shadow"
      UI_GRAPH_SELECTOR_FIRST: "true"
      UI_GRAPH_GRAPH_RUNTIME: "true"
      UI_GRAPH_AI_RECOVERY: "true"
      UI_GRAPH_CANDIDATE_LEARNING: "true"
      UI_GRAPH_AUTO_PROMOTION: "false"
    volumes:
      - ${APP_DATA_DIR}/data/phone-network:/data
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --tries=1
        - http://localhost:21211/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  redis:
    hostname: phone-network-redis
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    hostname: phone-network-db
    image: postgres:16-alpine
    env_file:
      - ${APP_DATA_DIR}/.env
    restart: unless-stopped
    environment:
      POSTGRES_DB: phoneNetwork
      POSTGRES_USER: phoneNetwork
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U phoneNetwork -d phoneNetwork
      interval: 10s
      timeout: 5s
      retries: 5

manifestVersion: 1
id: phone-network
category: networking
name: Phone Network
version: "3.9.267"
tagline: Fleet management for Android devices with edge workflow execution
description: >-
  Phone Network manages a fleet of Android devices for remote control,
  monitoring, and automation. Includes device registration, task queuing,
  workflow templates with edge execution (ADR-001), human behavior emulation,
  and a web dashboard for fleet oversight.
releaseNotes: >-
  v3.9.267: manage lifecycle stale policies directly in PostgreSQL through an authenticated generic control plane
  v3.9.265: move the task lifecycle contract into PostgreSQL-owned states and transitions, without runtime status lists
  v3.9.264: align task cancellation with the PostgreSQL status contract so administratively closed tasks cannot remain retry-eligible
  v3.9.263: keep the bundled Android 4.0.83 OTA manifest consistent across Umbrel updates
  v3.9.261: suppress duplicate Segment Builder recovery dispatches and ship Android 4.0.77 with process-death recovery and persistent lifecycle telemetry
  v3.9.259: recover interrupted Segment Builder leases and expire offline queued canaries automatically
  v3.9.258: keep Segment Builder previews polling until the promoted plan is ready
  v3.9.257: resume completed Segment Builder jobs through their promoted PostgreSQL composition
  v3.9.256: route missing workflow segments to a durable authenticated OpenClaw builder and harden its context API against server restarts
  v3.9.254: connect promoted PostgreSQL compositions automatically and let canary runs retrieve their candidate artifacts
  v3.9.252: reject cross-intent workflow cache reuse and empty dashboard outputs
  v3.9.250: make the human-workflow compiler fully PostgreSQL-authoritative and fail closed on missing policy
  v3.9.249: keep compiler normalization inside database Goal Contracts and add the Chrome runtime profile
  v3.9.248: move product and workflow semantics to PostgreSQL and retire legacy code-owned catalogs
  v3.9.246: enforce database-owned goal contracts, generic runtime bindings, read-only UI input semantics, and ship agent 4.0.64
  v3.9.245: enforce semantic search-result extraction plans and ship viewport-safe Accessibility targeting with agent 4.0.63
  v3.9.244: reconcile authoritative late edge completion before failing runs or quarantining valid workflow artifacts
  v3.9.243: add verified UI state machines, coverage-gated promotion, replay/canary controls, and primary-cause telemetry; ship agent 4.0.62
  v3.9.242: retrieve saved workflows, verified fragments, UI graph knowledge, and prior failures before LLM compilation
  v3.9.241: reuse promoted workflow capabilities across devices and natural-language formulations before LLM fallback
  v3.9.240: add an explicit Device only target for accountless AI workflows
  v3.9.239: reconcile superseded incidents, correct recovery telemetry and ownership, and enforce explicit artifact safety
  v3.9.237: learn new verified read-only edge segments through compact hybrid bindings and ship agent 4.0.61
  v3.9.236: connect verified edge workflow results to shared learning and remove the legacy server runner
  v3.9.235: auto-promote read-only navigation knowledge after five clean verified runs and degrade it on failure
  v3.9.234: keep generic validator-feedback repair and load compiler navigation policy from PostgreSQL

  v3.9.140: add promotion readiness, confidence, scope details, and rollback preview
  v3.9.139: add controlled manual workflow definition promotion
  v3.9.138: enrich Workflow Validation Pipeline with fixtures, coverage, readiness scoring
  v3.9.136: republish Workflow Definition Registry App Store metadata

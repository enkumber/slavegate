manifestVersion: 1
id: phone-network
category: networking
name: Phone Network
version: "3.9.191"
tagline: Fleet management for Android devices with edge workflow execution
description: >-
  Phone Network manages a fleet of Android devices for remote control,
  monitoring, and automation. Includes device registration, task queuing,
  workflow templates with edge execution (ADR-001), human behavior emulation,
  and a web dashboard for fleet oversight.
releaseNotes: >-
  v3.9.191: guarantee terminal Android app launch results and ship Android 4.0.39
  v3.9.190: bound Android direct jobs and trace agent receive/start events
  v3.9.187: fail closed on missing device results and persist per-job execution traces
  v3.9.185: allow authorized workflow credentials and make Retry compile requeue failed AI jobs
  v3.9.184: verify conditional waits locally, fail closed on unknown conditions, and ship Android 4.0.37
  v3.9.182: refresh the live Accessibility controller for device-local postcondition polling and ship Android 4.0.35
  v3.9.181: poll device-local postconditions during UI transitions before retrying an action and ship Android 4.0.34
  v3.9.180: verify generic Android intent navigation locally against the resolved foreground package and ship Android 4.0.33
  v3.9.179: keep the Android Accessibility rebind watchdog active until the post-OTA service reconnects
  v3.9.174: persist executable workflow bundles atomically and ship Android 4.0.29 browser-content readiness
  v3.9.173: align OTA manifest metadata with the bundled Android 4.0.28 APK
  v3.9.172: compile HBE into full device workflow bundles with local execution and durable checkpoints
  v3.9.170: add a simple PostgreSQL FIFO workflow queue per device without changing step execution
  v3.9.169: restore the verified baseline from before Queue v1 and Queue v2 for live validation
  v3.9.168: make generated workflow cache persistence atomic and disable gate self-healing
  v3.9.167: isolate legacy workflow execution while Queue v2 remains available
  v3.9.166: restore the legacy DirectWS path while Queue v2 is disabled
  v3.9.165: add Queue v2 shadow real-route readiness gate
  v3.9.164: reconcile terminal PNQ roots with stale blocked child jobs
  v3.9.161: register workflow result waiter before device dispatch
  v3.9.160: continue server workflows after timeout-tolerant device effects
  v3.9.159: retain server workflow root after a child result timeout
  v3.9.158: start PNQ child timeout only after device dispatch
  v3.9.157: release terminal undispatched PNQ workflow roots
  v3.9.156: reconcile undispatched PNQ roots and preserve queued workflow state
  v3.9.155: await PNQ replay for queued server workflow child jobs
  v3.9.154: fix queued workflow replay and BustaBuster compile recovery
  v3.9.153: enable approved local GX10 model endpoints
  v3.9.152: add secure model configuration and queue safety hardening
  v3.9.151: fix AI Workflow task cache handle
  v3.9.150: fix Human AI Workflow compile and run endpoints

manifestVersion: 1
id: phone-network
category: networking
name: Phone Network
version: "3.9.166"
tagline: Fleet management for Android devices with edge workflow execution
description: >-
  Phone Network manages a fleet of Android devices for remote control,
  monitoring, and automation. Includes device registration, task queuing,
  workflow templates with edge execution (ADR-001), human behavior emulation,
  and a web dashboard for fleet oversight.
releaseNotes: >-
  v3.9.166: restore the legacy DirectWS path while Queue v2 is disabled
  v3.9.165: add Queue v2 shadow real-route readiness gate
  v3.9.164: reconcile terminal PNQ roots with stale blocked child jobs
  v3.9.161: register workflow result waiter before device dispatch
  v3.9.160: continue server workflows after timeout-tolerant device effects
  v3.9.159: retain server workflow root after a child result timeout
  v3.9.158: start PNQ child timeout only after device dispatch
  v3.9.157: release terminal undispatched PNQ workflow roots
  v3.9.156: reconcile undispatched PNQ roots and preserve queued workflow state
  v3.9.155: await PNQ replay for queued server workflow child jobs
  v3.9.154: fix queued workflow replay and BustaBuster compile recovery
  v3.9.153: enable approved local GX10 model endpoints
  v3.9.152: add secure model configuration and queue safety hardening
  v3.9.151: fix AI Workflow task cache handle
  v3.9.150: fix Human AI Workflow compile and run endpoints
  v3.9.149: add generated workflow self-healing retry loop
  v3.9.147: add generic generated workflow learning loop

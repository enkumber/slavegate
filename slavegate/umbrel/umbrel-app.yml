id: phone-network
category: networking
name: Phone Network
version: "3.9.145"
tagline: Fleet management for Android devices with edge workflow execution
description: >-
  Phone Network manages a fleet of Android devices for remote control,
  monitoring, and automation. Includes device registration, task queuing,
  workflow templates with edge execution (ADR-001), human behavior emulation,
  and a web dashboard for fleet oversight.

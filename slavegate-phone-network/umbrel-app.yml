manifestVersion: 1

id: slavegate-phone-network
name: Phone Network
tagline: Manage and orchestrate Android devices via Nostr
icon: https://raw.githubusercontent.com/dan-ciprian/phone-network/main/assets/icon.png

category: automation
version: "3.1.9"
port: 21211

developer: Dan
website: https://github.com/enkumber/slavegate
repo: https://github.com/enkumber/slavegate-server
support: https://github.com/enkumber/slavegate-server/issues

description: >-
  Phone Network server for remote Android fleet management.
  Communicates with devices through Nostr relay for NAT-friendly,
  encrypted messaging.

  Features:
  - Fleet management for Android devices
  - Nostr-based encrypted device communication (NIP-04 / NIP-17)
  - Real-time job dispatch: tap, swipe, type, screenshot, OTA updates
  - Workflow automation engine with step verification
  - Device registry with health monitoring
  - Coordinate learning cache for reliable UI automation
  - Screen detection cascade (UI tree → OCR → VLM)
  - App mapping with PostgreSQL persistence

releaseNotes: >-
  v3.1.9: Removed nostr-relay dependency.
  v3.1.8: Fixed device flags column (text[] → jsonb), fixed 011 migration
  (timestamp → created_at), all migrations non-fatal.
  v3.1.7: Removed shell-based migration that was crashing the container.
  Node.js auto-migrate is now fully non-fatal — server always starts.
  v3.1.6: Migration resilience fix — server starts even if migrations have errors.
  v3.1.5: Fixed job_type constraint to include ocr_find_tap, screenshot_for_vlm, open_app_fresh.
  v3.1.4: Fixed Docker image to include all DB migrations (app_maps, canary_rollouts, etc).
  v3.1.3: Auto-migrate DB schema at startup. Added POST /api/mapping/upload
  endpoint. Reddit app map seed (12 pages, 22 transitions). Fixed canary_rollouts
  table creation. Improved migration path resolution for Docker deployments.

dependencies:

submitter: Dan
submission: https://github.com/getumbrel/umbrel-apps

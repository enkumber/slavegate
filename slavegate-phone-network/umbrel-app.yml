description: >-
  Phone Network server for remote Android fleet management.
  Communicates with devices through Nostr relay for NAT-friendly,
  encrypted messaging.

  Features:
  - Fleet management for Android devices
  - Nostr-based encrypted device communication (NIP-04 / NIP-17)
  - Real-time job dispatch: tap, swipe, type, screenshot, OTA updates
  - Workflow automation engine with step verification
  - Device registry with health monitoring
  - Coordinate learning cache for reliable UI automation
  - Screen detection cascade (UI tree -> OCR -> VLM)
  - App mapping with PostgreSQL persistence
  - Workflow Compiler: NL instructions to executable workflows with AI fallback

releaseNotes: >-
  v3.8.10: Fix edge VLM bridge so Android workflows receive screenshot analysis results instead of empty strings.
  v3.8.9: Fix Reddit workflow loop counter, increase search budget, and relax candidate criteria so runs do not stop after 10 skipped posts.
  v3.8.8: Persist edge workflow status using canonical workflow columns; remove dependency on missing progress/result DB columns.
  v3.8.7: Preserve WORKFLOW_START protocol type after template merge so edge devices always receive runnable workflow messages.
  v3.8.6: Dispatch WORKFLOW_CANCEL to edge devices when cancelling DB workflows, preventing stale local runs from blocking new runs.
  v3.8.5: Persist edge workflow WORKFLOW_STATUS into current_step/checkpoint so Umbrel/API shows real device progress.
  v3.8.4: Manifest normalized to Umbrel community app store template fields and pinned fixed server image.
  v3.8.3: Pin Docker image to server build be4fd8f so Umbrel pulls the fixed edge workflow server.
  v3.8.2: Fix edge workflow monitoring by passing concrete workflowId to devices; includes Android agent 4.0.5 OTA/restart observability fixes.
  v3.8.1: Edge Workflow Execution - docker-compose fix
  v3.8.0: Edge Workflow Execution - workflows run on device
  v3.7.0: Fix BASE_URL env var for OTA push

